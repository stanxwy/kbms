[alembic]
# 迁移脚本目录（相对 alembic.ini 所在目录）
script_location = alembic
# 迁移前把 admin 工程根加入 sys.path，使 `import admin` 可解析
prepend_sys_path = .
# 实际 DSN 由 alembic/env.py 从 Settings.DATABASE_SYNC_URL 注入，此处留占位
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S